<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#143c32">
<meta name="robots" content="noindex">
<title>Administrator console — Kapiri Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/seller.css">
<style>
  .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .admin-table th, .admin-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e3e8e5; vertical-align: top; }
  .admin-table th { font-size: 12px; color: #5f6b65; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .checks { display: flex; flex-wrap: wrap; gap: 12px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  .table-wrap { overflow-x: auto; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .filters .field { min-width: 160px; }
  .plan-card { border: 1px solid #e3e8e5; border-radius: 12px; padding: 16px; display: grid; gap: 10px; }
</style>
</head>
<body class="seller-body">
<header class="seller-top">
  <a href="/" class="brand" aria-label="Kapiri Online home"><span class="brand-mark">K</span><span>kapiri<span class="brand-light">online</span></span></a>
  <div class="seller-top-right">
    <span id="whoami" class="small muted"></span>
    <a href="/" class="text-btn">Marketplace</a>
    <button class="text-btn hidden" id="signOutBtn" type="button">Sign out</button>
  </div>
</header>
<section id="authPanel" class="seller-auth hidden"></section>
<div id="pageArea" class="seller-layout hidden">
  <nav class="seller-nav" id="adminNav" aria-label="Administrator sections">
    <a href="#/overview" data-nav="overview">Overview</a>
    <a href="#/sellers" data-nav="sellers">Sellers &amp; plans</a>
    <a href="#/plans" data-nav="plans">Plans</a>
    <a href="#/invoices" data-nav="invoices">Invoices</a>
    <a href="#/orders" data-nav="orders">Orders</a>
    <a href="#/products" data-nav="products">Products</a>
    <a href="#/emails" data-nav="emails">Email log</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <main class="seller-main" id="view" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/admin.js" defer></script>
</body>
</html>
